# svk `admin` operator — declared for systemd-sysusers so it is NOT baked into
# the image's /etc/passwd at build time (that's what `bootc container lint`'s
# sysusers check flags). The account is created at first boot instead:
#   - uid/gid 1000 — the first regular-user id, i.e. THE primary account on every
#     machine in the fleet
#   - locked password (sysusers creates it locked → key-only SSH, no password login)
#   - member of `wheel` (sshd allows only group wheel; sudoers.d grants NOPASSWD)
#   - home /var/home/admin is created by tmpfiles.d/svk-admin.conf (sysusers does
#     not create home dirs — /var/home is machine state a bootc image can't carry)
#
# HIDDEN FROM THE GREETER, but not by its uid. At 1000 admin is above UID_MIN, so
# AccountsService no longer filters it automatically the way a system-range id
# would; it is hidden explicitly with SystemAccount=true — see
# ../../../etc/tmpfiles.d/svk-admin.conf. Change one and you must change the other,
# or admin starts appearing in the login screen's user list.
#
# The fleet's id map, fixed on purpose so every machine looks the same:
#   1000  admin   (here, first boot)
#   1001  staff   (lab machine: absent)   — kickstart, install time
#   1002  opilas  (staff laptop: absent)  — kickstart, install time
# Both kickstarts pin their uid AND gid explicitly (`group --gid=` before
# `user --uid= --gid=`), because useradd otherwise takes the lowest free id — and
# they run at INSTALL time, before sysusers has created admin at first boot, so
# without pinning a kickstart account would grab 1000 out from under it.
#
# A `u name <id>` entry claims that number as BOTH uid and gid, so both have to be
# free; build/30-users.sh asserts that at build time. (This is exactly what the
# original 980 got wrong: gid 980 is `power` in the Silverblue base, so sysusers
# discarded the id and fell back to whatever was free — 958 on a test run — giving
# admin a different id on every machine. Verified against a built image:
# "Suggested user ID 980 for admin already used.")
#
#Type  Name   ID    GECOS         Home             Shell
u      admin  1000  "SVK-Admin"   /var/home/admin  /bin/bash
m      admin  wheel

# `svk-staff` — the teacher-privilege group. Two jobs, both account-scoped so one
# image can serve a lab machine and a staff laptop:
#   - gnome-software is chgrp'd to it and chmod 750 (build/40-desktop.sh), so the
#     kiosk account can't launch an app store while staff can;
#   - polkit-1/rules.d/50-svk-staff-flatpak.rules grants it system-scope flatpak
#     installs without sudo or wheel membership.
# admin is a member too, so an operator at the GUI has the same reach.
#
# NAME: deliberately `svk-staff`, not `staff` — the login account created by the
# staff kickstart is itself called `staff`, and useradd refuses to create a user
# whose user-private group name already exists ("group staff exists - if you want
# to add this user to that group, use -g"), which would abort the install.
#
# GID: fixed at 481, not dynamic, because the build-time `chgrp` in
# build/40-desktop.sh runs long before this group exists and can therefore only
# reference it numerically — and if sysusers ever allocated a different gid than
# that chgrp used, gnome-software would end up group-owned by whatever package won
# and nothing would report it. build/40-desktop.sh asserts 481 is still free at
# build time.
#
# It stays in the SYSTEM range (below GID_MIN=1000) even though the three human
# accounts are now at 1000-1002: it is a privilege group, not a person, and the
# 1000+ range belongs to per-user private groups. 481 specifically because
# Silverblue's dynamic allocator counts DOWN from 999 and has already reached 959,
# so the whole 959-999 band is taken (the first attempt used 981, which is
# `printadmin`), while 191-958 is completely empty.
#
#Type  Name       ID
g      svk-staff  481
m      admin      svk-staff
