# Session display language for every account created from /etc/skel: Finnish.
# Lives under /etc/skel (not baked into a build-time home — bootc drops
# /var/home) so it's replanted into /home/opilas every time reset-opilas-home.sh
# copies skel back in, and is picked up by staff accounts at creation time.
#
# The per-ROLE companion file (20-svk-role.conf: DCONF_PROFILE + XDG_DATA_DIRS)
# is NOT shipped here — it is written into /etc/skel by the kickstart, because
# which role a machine has is an install-time decision, not an image one. See
# iso/installer/build.sh.
#
# systemd's user manager (and pam_systemd on session start) reads
# environment.d files and exports these into the graphical session — this is
# the supported per-user way to set locale without touching AccountsService,
# whose /var/lib/AccountsService state isn't persisted the same way (see
# reset-opilas-home.sh). Needs glibc-langpack-fi (build.base.sh) for the
# fi_FI.UTF-8 locale data to actually exist.
LANG=fi_FI.UTF-8
LANGUAGE=fi_FI:fi
