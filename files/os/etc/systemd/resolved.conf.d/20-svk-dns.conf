# Fleet DNS. Primary resolver is the self-hosted AdGuard Home on svk-server
# (fast local cache + self-hosted blocklists on campus); NextDNS is the fallback
# upstream so a machine that can't reach the server — a staff laptop off-site, or
# a lab machine while the server is down — stays filtered instead of falling
# through to whatever the DHCP lease handed it. Opportunistic DoT means it still
# works if either hop can't do TLS.
#
# ONE profile, fleet-wide. svk-student and svk-staff used to point at two
# different NextDNS profiles (76fc42 / f6b9f6); with a single image there is no
# machine-side way to tell a lab machine from a staff laptop, so the school
# profile below applies everywhere. Keeping the stricter of the two is the safe
# direction — loosening one staff laptop is a per-machine change, and per-machine
# config is what the USB provisioning work owns
# (tasks/todo/20260719-0110-usb-provisioning-config.md).
#
# VERIFY ON REAL HARDWARE (see TODO.md §11-style items): NetworkManager
# usually pushes DHCP-supplied nameservers into resolved as per-link DNS,
# which can take priority over this global setting. If that happens here,
# the fix is `ipv4.ignore-auto-dns=yes` / `ipv6.ignore-auto-dns=yes` on the
# baked Wi-Fi profile (files/os/etc/NetworkManager/system-connections/).
#
# (my.nextdns.io -> Setup -> Router/Other -> DNS-over-TLS). The anycast IPs are
# NextDNS's documented DoT endpoints; only the profile id changes per customer.
[Resolve]
DNS=svk-server.local 45.90.28.0#76fc42.dns1.nextdns.io 45.90.30.0#76fc42.dns2.nextdns.io
DNSOverTLS=opportunistic
Domains=~.
