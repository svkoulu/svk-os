# Fleet cadence: weekly, Monday morning before the school day starts.
#
# One image, one cadence — svk-student's monthly / svk-staff's weekly split is
# gone. Weekly for everything is the right call because this timer only STAGES:
# the service.d drop-in next door replaces upstream's `bootc upgrade --apply`
# with a wrapper that drops --apply, so a staged update lands at the machine's
# own next natural boot, never mid-class. The slower kiosk cadence was buying
# fewer disruptive windows that, with staging, don't exist. See
# tasks/todo/…-fleet-update-cadence.md.
#
# OnBootSec=/OnUnitInactiveSec= are cumulative directives in systemd — an
# empty assignment clears upstream's OnBootSec=1h/OnUnitInactiveSec=8h before
# OnCalendar= below takes over as the sole trigger. RandomizedDelaySec/
# Persistent are single-value and simply override upstream's.
[Timer]
OnBootSec=
OnUnitInactiveSec=
OnCalendar=Mon *-*-* 05:00:00
RandomizedDelaySec=3h
Persistent=true
