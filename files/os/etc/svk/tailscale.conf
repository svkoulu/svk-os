# Tailscale config for this machine. The enrollment MECHANISM lives in
# svk-tailscale-enroll.service / usr/bin/svk-tailscale-enroll.sh; this file is
# the DATA it reads.
#
#   TAILSCALE_TAG    — the ACL tag this machine advertises, and the prefix
#                      svk-claim-hostname.sh uses for fallback hostnames.
#   TAILSCALE_ENROLL — yes/no. "yes" = on first boot, read the auth key from the
#                      provisioning USB (filesystem label SVK-PROV, file
#                      "tailscale-authkey") and run `tailscale up`. Keys are
#                      NEVER baked into an image.
#
# One image now serves lab machines and staff laptops, so this can no longer be
# decided at build time the way svk-student/svk-staff did it. The fleet default
# is "no": the tailnet has a 50-device cap, lab machines stay off it entirely,
# and enrolling 30 kiosks by accident is the expensive mistake. Machines that DO
# belong on the tailnet (staff laptops) get opted in — and get their real tag —
# per machine at provisioning time; see
# tasks/todo/20260719-0110-usb-provisioning-config.md. Until that lands, flip it
# by hand on the machine (edit this file, then `systemctl start
# svk-tailscale-enroll` with the USB inserted).
TAILSCALE_TAG="tag:svk-node"
TAILSCALE_ENROLL="no"
