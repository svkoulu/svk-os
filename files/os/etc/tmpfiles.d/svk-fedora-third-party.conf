# Answer Fedora's "third-party repositories" question for the fleet, so nobody
# at a desktop ever has to.
#
# THE BUG THIS FIXES (seen on the first real staff laptop, 2026-08-20): GNOME
# Software shows a dialog on first launch asking whether to enable third-party
# repositories. It has two buttons and NO dismiss — and both buttons run
# /usr/bin/fedora-third-party through polkit:
#
#   Enable  -> org.fedoraproject.thirdparty.run      allow_active = auth_admin_keep
#   Ignore  -> org.fedoraproject.thirdparty.opt-out  allow_active = auth_admin_keep
#
# fedora-third-party's own rules.d file waives the prompt for the opt-out, but
# only for members of `wheel` — and `staff` is deliberately not in wheel (local
# sudo is admin-only, over SSH). So the staff account gets an admin password
# prompt on BOTH options and the dialog comes back forever. Setting a real admin
# password makes the prompt answerable (see ADMIN_PASSWORD in
# iso/installer/build.sh); this file makes it never appear, which is the actual
# fix — a teacher should not be typing the operator password to close a dialog.
#
# WHAT IT WRITES: fedora-third-party keys everything off whether `enabled` is
# *set*, not what it is — `query` distinguishes "disabled" from "disabled (no
# selection has been made)", and gnome-software only asks in the second case.
# Writing `enabled = no` records the school's answer and retires the question.
#
# WHY `no`: the only third-party repository this base configures is `flathub`
# (/usr/lib/fedora-third-party/conf.d/fedora-flathub.conf), and the fleet already
# has that remote — the Titanoboa installer adds it system-wide and bakes the app
# set into /var/lib/flatpak (iso/installer/build.sh). Letting Fedora's opt-in add
# its own filtered copy on top would mean two sources of truth for the same
# remote, and the LAN Flathub mirror is where updates are supposed to come from.
#
# This does NOT touch the existing remote. On the next boot,
# fedora-third-party-refresh.service sees a set state and calls disable() on
# `flathub`, which returns immediately because we never recorded the remote as
# `added = yes` — the tool only modifies remotes it added itself. Verified
# against repository.py in the built image.
#
# `f`, not `f+`: create-if-missing. The tool writes its own bookkeeping (`seen`,
# `added`) into this same file, and an operator may legitimately run
# `fedora-third-party enable` on one machine. Truncating every boot would fight
# both. The parent /var/lib/fedora-third-party comes from the base's
# rpm-ostree-autovar.conf, and systemd-tmpfiles orders items by path, so it
# exists by the time this line runs — same reasoning as the AccountsService drop-in
# in svk-admin.conf.
f /var/lib/fedora-third-party/state 0644 root root - [main]\nenabled = no\n
