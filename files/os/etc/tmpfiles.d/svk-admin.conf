# PERMANENT home directory for the admin operator.
#
# Despite living under tmpfiles.d, this is NOT a temporary/volatile dir: the `d`
# type only creates the directory if it's missing and fixes its mode/owner — it
# never deletes it, and with no age field (the trailing `-`) the tmpfiles-clean
# timer never touches it. Once created it persists across reboots and image
# updates like any other /var content.
#
# We create it here rather than baking it into the image because the account is
# declared via sysusers.d (usr/lib/sysusers.d/svk-admin.conf) but /var/home is
# machine-state that a bootc image does not carry. This is the standard bootc
# pattern for a persistent home
# under /var. (The server does the equivalent once, via Ignition in server.bu.)
d /var/home/admin 0700 admin admin -

# HIDE admin from the login screen's user list.
#
# admin sits at uid 1000 (see usr/lib/sysusers.d/svk-admin.conf) — the primary
# account on every machine, but not one anybody should be clicking on at the
# greeter. Because 1000 is at/above UID_MIN, AccountsService no longer filters it
# out automatically the way a system-range uid would, so it has to be told
# explicitly: SystemAccount=true makes act_user_is_system_account() true, and GDM
# leaves those out of the user list. Logging in is still possible via
# "Not listed?", and SSH is unaffected.
#
# Written from tmpfiles rather than shipped in the image because
# /var/lib/AccountsService is machine state that a bootc image does not carry.
# The parent directories already come from the base's own
# /usr/lib/tmpfiles.d/rpm-ostree-autovar.conf, and systemd-tmpfiles orders items
# by path, so they exist by the time this line runs.
#
# `f+` (truncate-and-write every boot), not `f` (create-if-missing): hiding the
# operator account is fleet policy, and this way a machine converges back to it
# even if something rewrote the file. The cost is that AccountsService's own
# per-user state for admin (stored session, language, icon) is reset each boot —
# irrelevant for an account that is SSH-first and only visits the GUI for
# hands-on diagnostics.
f+ /var/lib/AccountsService/users/admin 0600 root root - [User]\nSystemAccount=true\n
