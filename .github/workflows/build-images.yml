# Reusable: build + sign + push the fleet image for ONE channel from ONE ref.
# Called by build.yml once per channel (stable and/or testing) so a single run can
# publish both channels without duplicating the build steps.
#
# One image only: svk-server moved to its own repo (../svk-server, 2026-07-27) —
# it was FROM uCore and shared no build code with this one. There is no svk-base
# and no BASE_IMAGE plumbing either: the two desktop flavors it existed to share
# code with were collapsed into svk-os itself
# (tasks/done/…-single-image-collapse.md).
#
# Signing stays keyed + pinned to the Cosign v2 line: the v4 installer defaults to
# Cosign v3, which moved signatures to OCI 1.1 referrers — invisible to the fleet's
# registries.d `use-sigstore-attachments` verifier, which would block every machine
# from pulling updates. Revisit only once that verifier supports OCI 1.1 referrers.
name: build-images

on:
  workflow_call:
    inputs:
      channel:
        description: stable | testing
        required: true
        type: string
      ref:
        description: Git ref to build (a tag for stable, main for testing).
        required: true
        type: string
      major:
        description: Release-line number (git tag) for stable; "" for testing.
        required: false
        type: string
        default: ""
      date:
        description: Build date YYYYMMDD, computed once by the caller.
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  # GHCR namespace that owns the image. Must match cosign.pub's owner.
  NAMESPACE: svkoulu

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: svk-os       # every lab machine and staff laptop
            containerfile: Containerfile.os
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: sigstore/cosign-installer@v4.1.3
        with:
          cosign-release: "v2.5.3"   # v2 line — see file header
      - uses: ./.github/actions/build-image
        with:
          image: ${{ matrix.image }}
          containerfile: ${{ matrix.containerfile }}
          channel: ${{ inputs.channel }}
          major: ${{ inputs.major }}
          date: ${{ inputs.date }}
          registry: ${{ env.REGISTRY }}
          namespace: ${{ env.NAMESPACE }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          cosign_key: ${{ secrets.COSIGN_PRIVATE_KEY }}
          cosign_password: ${{ secrets.COSIGN_PASSWORD }}
