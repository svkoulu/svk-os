# Builds THE installer ISO with Titanoboa.
#
# Titanoboa squashfs's a throwaway "installer image" (see iso/build-iso.sh +
# iso/installer/) into a live-boot ISO; that installer image bakes the offline
# flatpak set + Anaconda + BOTH role kickstarts, so first boot needs no network and
# one ISO provisions both lab machines and staff laptops (the operator picks the
# role from the GRUB menu). ISOs are only needed when provisioning new hardware,
# are slow, and produce large artifacts. Existing machines never need this — they
# auto-update from the registry.
#
# Runs two ways:
#   - Reusable (workflow_call): build.yml calls this per channel AFTER that channel's
#     images are pushed, so a push to main (testing) or a git tag (stable) refreshes
#     the installer ISO alongside the images — same channel routing as build.yml.
#     The ISO pulls svk-os:<channel> from GHCR, so it MUST run after the image
#     build, which is why build.yml chains it with `needs` rather than triggering here.
#   - Manual (workflow_dispatch): on-demand run from the Actions tab, pick the
#     channel (e.g. to rebuild the ISO without republishing the images).
name: iso

on:
  workflow_call:
    inputs:
      channel:
        description: stable | testing.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      channel:
        description: Which channel to bake (stable needs at least one cut git tag).
        type: choice
        default: stable
        options: [stable, testing]

env:
  REGISTRY: ghcr.io
  NAMESPACE: svkoulu

permissions:
  contents: read
  packages: read

jobs:
  iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Titanoboa materializes a full live rootfs + ISO; the default runner's free
      # space isn't enough. Strip preinstalled toolchains first (same fix build.yml
      # ISO jobs used historically).
      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@cc0becac701cf642c8f0a6613bbdaf5dc36b259e # v9
        with:
          remove-codeql: true

      # Plain (rootless) podman: the whole ISO build runs as the runner user and
      # reads one store — see the rootless note in iso/build-iso.sh. A `sudo podman
      # login` here would authenticate the wrong store and the pull would 401.
      - name: Login to GHCR
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          .github/scripts/retry.sh 5 bash -c '
            echo "${REGISTRY_TOKEN}" | podman login "${REGISTRY}" \
              -u "${{ github.actor }}" --password-stdin'

      # Retried on transient registry/CDN failures only (retry.sh classifies): the ISO
      # build pulls the image plus the whole flatpak set, so it has a lot of network
      # surface, but it is also slow — re-running a real failure isn't worth it.
      - name: Build ISO with Titanoboa
        run: |
          .github/scripts/retry.sh 2 bash iso/build-iso.sh ghcr "${{ inputs.channel }}"

      - name: Short commit SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # Name the artifact with channel + commit so the downloaded zip is
      # self-identifying (e.g. svk-os-testing-a1b2c3d-iso.zip). Upload the ISO
      # plus its build-info.json provenance sidecar (iso/build-iso.sh). The glob is
      # kept narrow ON PURPOSE — the ISO is a large, sensitive artifact, and nothing
      # else under iso/ (build caches, any local sidecars) should be swept in.
      - name: Upload ISO artifact
        uses: actions/upload-artifact@v7
        with:
          name: svk-os-${{ inputs.channel }}-${{ steps.sha.outputs.short }}-iso
          path: |
            iso/svk-os-*.iso
            iso/svk-os-*.build-info.json
          if-no-files-found: error
